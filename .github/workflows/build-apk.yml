name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release para anexar o APK (ex: v1.0.20)'
        required: false
        default: 'v1.0.20'
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build & Attach APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Chacara-Inventario.apk
          ls -lh ./Chacara-Inventario.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chacara-Inventario-APK
          path: ./Chacara-Inventario.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            TAG="v1.0.20"
          fi
          echo "Target Release Tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Anexando APK na release existente $TAG..."
            gh release upload "$TAG" ./Chacara-Inventario.apk --clobber
          else
            echo "Release $TAG não encontrada. Criando release..."
            gh release create "$TAG" ./Chacara-Inventario.apk --title "$TAG - Atualização OTA" --generate-notes
          fi
          echo "✅ APK anexado com sucesso na release $TAG!"
